# Unsigned release builds. Pushing a tag v<version> (matching [workspace.package] version in
# Cargo.toml) or running the workflow by hand builds every installer below and creates or updates
# a draft GitHub Release "LiVi Cut v<version>" with them and SHA256SUMS.txt. Nobody sees a draft
# until it is published.
#
# Nothing is signed: macOS builds are ad-hoc signed (Gatekeeper asks users to allow the app in
# System Settings > Privacy & Security), Windows installers are unsigned (SmartScreen warns on
# first run). The packaging scripts sign by themselves once signing secrets exist.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      date: ${{ steps.v.outputs.date }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        name: Read the version from Cargo.toml
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          . packaging/env.sh
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$VERSION" =~ $semver ]]; then
            echo "::error::Cargo.toml version '$VERSION' is not like 1.2.3 or 1.2.3-rc.1"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $REF_NAME does not match the Cargo.toml version $VERSION (expected v$VERSION)"
            exit 1
          fi
          case "$VERSION" in *-*) pre=true ;; *) pre=false ;; esac
          {
            echo "version=$VERSION"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "prerelease=$pre"
          } >> "$GITHUB_OUTPUT"
          echo "### LiVi Cut v$VERSION (\`${GITHUB_SHA::9}\`), unsigned" >> "$GITHUB_STEP_SUMMARY"

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    timeout-minutes: 120
    env:
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-macos-universal
      # No MACOS_SIGN_IDENTITY: package.sh signs ad hoc and skips notarization.
      - name: Build and package (DMG, CLI zip)
        run: packaging/macos/package.sh --arch universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    env:
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-windows-${{ matrix.arch }}
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      # No signing secrets: sign.ps1 warns and leaves the binaries and MSI unsigned.
      - name: Build and package (MSI, portable zip)
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: ./packaging/windows/package.ps1 -Arch $env:ARCH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # The oldest supported Ubuntu, so the binaries run on newer glibc too.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04, deb: amd64, nfpm_sha256: 3f1cf344bd0b57373ca55636a78c08b0491f7293d609a456a9ac3b0b150fda97 }
          - { arch: aarch64, runner: ubuntu-22.04-arm, deb: arm64, nfpm_sha256: 27419eb382695a7942be8ad52259f3ec1854fad001b3ae4baed34ce39a223b97 }
    env:
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
      NFPM_VERSION: "2.47.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build and packaging tools
        env:
          DEB_ARCH: ${{ matrix.deb }}
          NFPM_SHA256: ${{ matrix.nfpm_sha256 }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev \
            libasound2-dev pkg-config desktop-file-utils appstream python3-yaml zsync
          curl --proto '=https' --proto-redir =https -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${DEB_ARCH}.deb"
          echo "$NFPM_SHA256  $RUNNER_TEMP/nfpm.deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"
          nfpm --version
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-linux-${{ matrix.arch }}
      - name: Build and package (AppImage, deb, rpm, tar.gz)
        run: packaging/linux/package.sh
      - name: Smoke-test the AppImage
        run: |
          set -euo pipefail
          for appimage in dist/release/*.AppImage; do
            chmod +x "$appimage"
            APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --version
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  flatpak:
    name: Flatpak ${{ matrix.arch }}
    needs: [version, linux]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    env:
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-${{ matrix.arch }}
          path: dist/linux
      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          # Ubuntu 24.04 blocks the unprivileged user namespaces flatpak-builder's bwrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build the Flatpak bundle
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=()
          for f in dist/linux/*-"$FILMCRAFT_VERSION"-linux-"$ARCH".tar.gz; do
            case "${f##*/}" in *-cli-*) ;; *) tarballs+=("$f") ;; esac
          done
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected one app tarball in release-linux-$ARCH, found ${#tarballs[@]}: ${tarballs[*]}"
            exit 1
          fi
          packaging/linux/flatpak-bundle.sh "${tarballs[0]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak-${{ matrix.arch }}
          path: dist/release/*.flatpak
          if-no-files-found: error

  web:
    name: Web (wasm)
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FILMCRAFT_VERSION: ${{ needs.version.outputs.version }}
      FILMCRAFT_BUILD_DATE: ${{ needs.version.outputs.date }}
      FILMCRAFT_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-web
      # package.sh installs the wasm-bindgen CLI at the crate's exact version when CI is set.
      - name: Build and zip
        run: packaging/web/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: dist/release/*
          if-no-files-found: error

  release:
    name: Draft GitHub Release
    needs: [version, macos, windows, linux, flatpak, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Create or update the draft
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          title="LiVi Cut v$VERSION"
          notes="Unsigned build. macOS: allow LiVi Cut in System Settings > Privacy & Security on first launch. Windows: SmartScreen warns on first run (More info > Run anyway). Check downloads against SHA256SUMS.txt."
          if draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [ "$draft" != true ]; then
              echo "::error::$tag is already published; bump the version in Cargo.toml first"
              exit 1
            fi
            echo "Updating draft $tag: replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' | while read -r asset; do
              gh release delete-asset "$tag" "$asset" --yes
            done
            gh release edit "$tag" --draft --title "$title" --target "$GITHUB_SHA" --prerelease="$PRERELEASE"
            gh release upload "$tag" --clobber -- *
          else
            pre=()
            if [ "$PRERELEASE" = true ]; then pre=(--prerelease); fi
            gh release create "$tag" --draft --title "$title" --target "$GITHUB_SHA" --notes "$notes" "${pre[@]}" -- *
          fi
          {
            echo "Draft release **$title** at \`${GITHUB_SHA::9}\`:"
            echo
            sed 's/^/    /' SHA256SUMS.txt
          } >> "$GITHUB_STEP_SUMMARY"
